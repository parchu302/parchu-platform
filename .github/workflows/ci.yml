name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parchu

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parchu
          POSTGRES_PASSWORD: parchu_ci
          POSTGRES_DB: parchu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U parchu -d parchu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://parchu:parchu_ci@localhost:5433/parchu?schema=public
      # Placeholders solo para CI: los secretos reales viven en el entorno de deploy.
      SESSION_SECRET: ci-placeholder-no-es-un-secreto-real
      CONFIRMATION_CODE_SECRET: ci-placeholder-no-es-un-secreto-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parchu/package-lock.json

      - run: npm ci

      - name: Validar schema de Prisma
        run: npx prisma validate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build
