name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parchu

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parchu
          POSTGRES_PASSWORD: parchu_ci
          POSTGRES_DB: parchu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U parchu -d parchu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://parchu:parchu_ci@localhost:5433/parchu?schema=public
      ADMIN_EMAIL: admin@parchu.ci
      # Ephemera y descartable en cada run: aqui SI es seguro sembrar datos demo,
      # los necesitan los E2E de paginacion (Fase 4).
      SEED_DEMO_DATA: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: parchu/package-lock.json

      - run: npm ci

      # Secretos efímeros, generados por ejecución: nunca versionados.
      # SESSION_SECRET debe ser una clave de 32 bytes en base64.
      - name: Generar secretos efímeros de CI
        run: |
          echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CONFIRMATION_CODE_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -base64 18)Aa1" >> "$GITHUB_ENV"

      - name: Validar schema de Prisma
        run: npx prisma validate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Sembrar administrador
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (escenarios Gherkin)
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: parchu/playwright-report/
          retention-days: 7
