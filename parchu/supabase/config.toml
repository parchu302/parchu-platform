# Supabase local config (equivalente a `supabase init`).
# El proyecto remoto se vincula con: supabase link --project-ref ngqleggzurgilmjqvrho
project_id = "parchu"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.product-images]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/auth/confirm"]
jwt_expiry = 28800            # 8h, igual que la sesión actual
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true   # verificación de correo OBLIGATORIA (requerimiento)
double_confirm_changes = true

# Template de confirmación: enlaza al callback server-side con token_hash.
# En local, los correos quedan en Inbucket (http://localhost:54324).
[auth.email.template.confirmation]
subject = "Confirmá tu cuenta en ParchU"
content_path = "./supabase/templates/confirmation.html"

# Hook que inyecta el rol (EMPRENDEDOR/ADMIN) como custom claim en el JWT.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[analytics]
enabled = false
